spring:
  application:
    name: soundwave-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/soundwave?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

soundwave:
  security:
    jwt-secret: ${JWT_SECRET:soundwave-local-development-secret-change-this-32chars}
    token-ttl: PT24H
